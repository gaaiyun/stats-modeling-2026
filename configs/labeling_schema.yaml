# ============================================================
# 新质生产力 LLM 多维语义打标 schema
# ============================================================
# 5 大维度（基于党中央"新质生产力"定义）+ 每维 1-10 分
# 参考文献：
# - 习近平 2024.5《求是》
# - 周颖刚等 (2025 计量经济学报)：5 大领域：农业 / 工业 / 服务业 / 基础设施 / 劳动者
# - 韩文龙等 (2024 数量经济技术经济研究)：新质生产力水平测算
# - 陈钰芬等 (2025 科研管理)：投入-过程-产出 40 项指标
#
# 我们的 5 维度选择理由：契合"高科技 / 高效能 / 高质量"特征 +
# 兼容上述文献的核心维度，且适合 LLM 一次性多维打分（控制 token 成本）
# ============================================================

dimensions:
  - id: tech_innovation
    name: 科技创新
    name_en: Technology Innovation
    keywords_seed:  # 用作 prompt 中的"提示词"（不限制 LLM）
      - 关键核心技术
      - 原创性引领性
      - 基础研究
      - 颠覆性技术
      - 攻关
      - 卡脖子
      - 前沿技术
      - 未来产业
      - 人工智能
      - 量子
      - 集成电路
      - 生物制造
    description: |
      文本中科技创新的力度、深度和原创性。
      高分（8-10）：明确提出关键核心技术攻关、基础研究、颠覆性创新、未来产业培育等具体举措。
      中分（4-7）：泛指科技创新支持，但缺乏具体领域或行动。
      低分（1-3）：只有口号式表述（如"加强创新"），无实质内容。

  - id: industrial_upgrade
    name: 产业升级
    name_en: Industrial Upgrade
    keywords_seed:
      - 战略性新兴产业
      - 新兴产业
      - 现代化产业体系
      - 产业转型升级
      - 高端制造
      - 智能制造
      - 服务业升级
      - 数字化转型
      - 产业链供应链
    description: |
      传统产业转型升级 + 新兴产业培育力度。
      高分：具体新兴产业（如新能源、新材料、生物医药、AI、量子计算）+ 转型路径（链长制 / 集群 / 新质动能）。
      中分：泛指产业升级、转型。
      低分：只提"做强做优"。

  - id: green_low_carbon
    name: 绿色低碳
    name_en: Green & Low-carbon
    keywords_seed:
      - 双碳
      - 碳达峰
      - 碳中和
      - 绿色低碳
      - 节能降耗
      - 清洁能源
      - 新能源
      - 循环经济
      - 生态保护
      - 减污降碳
    description: |
      绿色低碳转型力度。
      高分：明确双碳路径、清洁能源占比目标、绿色制造体系。
      中分：泛指生态环保。
      低分：只提"美丽中国"等口号。

  - id: digital_empowerment
    name: 数字赋能
    name_en: Digital Empowerment
    keywords_seed:
      - 数字经济
      - 数字化
      - 数字基础设施
      - 算力
      - 数据要素
      - 工业互联网
      - 智能制造
      - 5G
      - 大数据
      - 人工智能
      - 数实融合
    description: |
      数字技术赋能实体经济的力度。
      高分：数据要素市场、算力基础设施、数字产业集群、智能制造示范、数实融合具体举措。
      中分：提数字化转型但缺路径。
      低分：只提"数字中国"。

  - id: talent_support
    name: 人才支撑
    name_en: Talent Support
    keywords_seed:
      - 人才队伍
      - 人才培养
      - 高技能人才
      - 工程师
      - 大国工匠
      - 教育强省
      - 创新人才
      - 科技领军
      - 战略科学家
      - 产教融合
    description: |
      人才战略 / 教育投入 / 创新人才培养力度。
      高分：明确人才计划、教育投入比例目标、产教融合模式、领军人才引进政策。
      中分：泛指"人才强省/强市"。
      低分：只提教育公平等基础话题（重要但不直接关联新质生产力）。

# 全局打分约束
scoring:
  scale: [1, 10]              # 1=完全没有，10=非常深入
  json_schema:
    type: object
    required: [tech_innovation, industrial_upgrade, green_low_carbon, digital_empowerment, talent_support]
    properties:
      tech_innovation:
        type: integer
        minimum: 1
        maximum: 10
      tech_innovation_evidence:
        type: string
        description: "支撑该评分的关键句子或词组（≤50 字）"
      industrial_upgrade: {type: integer, minimum: 1, maximum: 10}
      industrial_upgrade_evidence: {type: string}
      green_low_carbon: {type: integer, minimum: 1, maximum: 10}
      green_low_carbon_evidence: {type: string}
      digital_empowerment: {type: integer, minimum: 1, maximum: 10}
      digital_empowerment_evidence: {type: string}
      talent_support: {type: integer, minimum: 1, maximum: 10}
      talent_support_evidence: {type: string}
      overall_summary:
        type: string
        description: "100 字内总结该报告的新质生产力总体倾向"
